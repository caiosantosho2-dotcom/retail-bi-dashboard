duckdb_origem: "C:/caminho/para/RAG_Varejo/data/processed/dunnhumby.duckdb"
rag_dir: "C:/caminho/para/RAG_Varejo"

# Análise de cesta (spec, seção 6): janela em semanas terminando na última semana completa, mínimo de cestas com o
# par para entrar no top 5, e corte de participação no faturamento para calcular pares de subcategorias.
cesta:
  semanas: 26
  minimo_cestas_par: 200
  corte_departamento_pct: 0.10
  # Rede de cestas da aba Produtos (spec 5.5): as N maiores subcategorias, as ligações de maior lift de cada uma
  # e os pares mais característicos de cada recorte de segmentos.
  rede_subcategorias: 80
  rede_ligacoes_por_no: 3
  rede_caracteristicos: 15

# Execução em etapas (um processo por etapa). Limite do DuckDB pensado para um notebook com 4 GB de RAM.
memoria:
  memory_limit: "1GB"
  threads: 2
