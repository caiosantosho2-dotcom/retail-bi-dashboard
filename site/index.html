<!doctype html>
<html lang="pt-BR">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Painel BI de Varejo</title>
  <link rel="icon" href="data:,">
  <link rel="stylesheet" href="css/tokens.css">
  <link rel="stylesheet" href="css/app.css">
  <script src="https://cdn.jsdelivr.net/npm/echarts@6.1.0/dist/echarts.min.js"></script>
  <script type="module" src="js/app.js"></script>
</head>
<body>
  <div class="app">
    <header class="topbar">
      <h1 class="topbar__titulo">Painel BI de Varejo</h1>
      <span class="topbar__periodo" id="periodo-base">Período da base: carregando…</span>
      <nav class="abas" role="tablist" aria-label="Abas do painel">
        <button class="aba" role="tab" id="aba-visao-geral" aria-controls="painel-visao-geral" aria-selected="true" tabindex="0">Visão Geral</button>
        <button class="aba" role="tab" id="aba-categoria" aria-controls="painel-categoria" aria-selected="false" tabindex="-1">Ficha da Categoria</button>
        <button class="aba" role="tab" id="aba-segmentos" aria-controls="painel-segmentos" aria-selected="false" tabindex="-1">Segmentos</button>
        <button class="aba" role="tab" id="aba-lojas" aria-controls="painel-lojas" aria-selected="false" tabindex="-1">Lojas</button>
        <button class="aba" role="tab" aria-disabled="true" aria-selected="false" tabindex="-1">Produtos <span class="aba__breve">em breve</span></button>
        <button class="aba" role="tab" aria-disabled="true" aria-selected="false" tabindex="-1">Laboratório <span class="aba__breve">em breve</span></button>
      </nav>
      <button class="filtro filtro--contraste" id="alto-contraste" type="button" aria-pressed="false" title="Texturas nos gráficos, além da cor">Alto contraste</button>
    </header>

    <div class="filtros" role="group" aria-label="Filtros globais">
      <div class="filtros__grupo" role="group" aria-labelledby="rotulo-periodo">
        <span class="filtros__rotulo" id="rotulo-periodo">Período</span>
        <button class="filtro" type="button" data-periodo="4s" aria-pressed="false">Últimas 4 semanas</button>
        <button class="filtro" type="button" data-periodo="13s" aria-pressed="false">13 semanas</button>
        <button class="filtro" type="button" data-periodo="26s" aria-pressed="true">26 semanas</button>
        <button class="filtro" type="button" data-periodo="base" aria-pressed="false">Base inteira</button>
      </div>
      <div class="filtros__grupo" role="group" aria-labelledby="rotulo-segmento">
        <span class="filtros__rotulo" id="rotulo-segmento" title="O segmento é calculado na janela de 26 semanas e vale para todo o histórico do cliente">Segmento atual do cliente</span>
        <span class="chips" id="chips-segmento"></span>
      </div>
      <div class="filtros__grupo filtro-departamento">
        <button class="filtro" id="botao-departamentos" type="button" aria-haspopup="dialog" aria-expanded="false" aria-controls="popover-departamentos" aria-pressed="false">Departamento: todos ▾</button>
        <div class="popover" id="popover-departamentos" role="dialog" aria-label="Filtro de departamento" hidden>
          <input class="campo" id="busca-departamento" type="search" placeholder="Buscar departamento" aria-label="Buscar departamento" autocomplete="off">
          <ul class="lista-departamentos" id="lista-departamentos" aria-label="Departamentos, do maior para o menor faturamento em 26 semanas"></ul>
        </div>
      </div>
      <button class="filtro" id="limpar-filtros" type="button">Limpar tudo</button>
      <div class="etiquetas" id="etiquetas-filtro" aria-label="Filtros ativos" aria-live="polite" hidden></div>
      <p class="filtros__nota" id="nota-filtro" hidden></p>
    </div>

    <main class="conteudo">
      <section class="painel-aba" id="painel-visao-geral" role="tabpanel" aria-labelledby="aba-visao-geral"></section>
      <section class="painel-aba" id="painel-categoria" role="tabpanel" aria-labelledby="aba-categoria" hidden></section>
      <section class="painel-aba" id="painel-segmentos" role="tabpanel" aria-labelledby="aba-segmentos" hidden></section>
      <section class="painel-aba" id="painel-lojas" role="tabpanel" aria-labelledby="aba-lojas" hidden></section>
    </main>

    <footer class="rodape" id="sobre-os-dados" aria-label="Sobre os dados">Sobre os dados: carregando…</footer>
  </div>
</body>
</html>
