<!doctype html>
<html lang="pt-BR">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Painel BI de Varejo</title>
  <link rel="icon" href="data:,">
  <link rel="stylesheet" href="css/tokens.css">
  <link rel="stylesheet" href="css/app.css">
  <script src="https://cdn.jsdelivr.net/npm/echarts@6.1.0/dist/echarts.min.js"></script>
  <script type="module" src="js/app.js"></script>
</head>
<body>
  <div class="app">
    <header class="topbar">
      <h1 class="topbar__titulo">Painel BI de Varejo</h1>
      <span class="topbar__periodo" id="periodo-base">Período da base: carregando…</span>
      <nav class="abas" role="tablist" aria-label="Abas do painel">
        <button class="aba" role="tab" id="aba-visao-geral" aria-controls="painel-visao-geral" aria-selected="true" tabindex="0">Visão Geral</button>
        <button class="aba" role="tab" id="aba-ficha" aria-controls="painel-ficha" aria-selected="false" tabindex="-1">Ficha do Cliente</button>
        <button class="aba" role="tab" id="aba-segmentos" aria-controls="painel-segmentos" aria-selected="false" tabindex="-1">Segmentos</button>
        <button class="aba" role="tab" aria-disabled="true" aria-selected="false" tabindex="-1">Lojas <span class="aba__breve">em breve</span></button>
        <button class="aba" role="tab" aria-disabled="true" aria-selected="false" tabindex="-1">Produtos <span class="aba__breve">em breve</span></button>
        <button class="aba" role="tab" aria-disabled="true" aria-selected="false" tabindex="-1">Laboratório <span class="aba__breve">em breve</span></button>
      </nav>
    </header>

    <div class="filtros" role="group" aria-label="Filtro de período">
      <span class="filtros__rotulo">Período</span>
      <button class="filtro" type="button" data-periodo="4s" aria-pressed="false">Últimas 4 semanas</button>
      <button class="filtro" type="button" data-periodo="13s" aria-pressed="false">13 semanas</button>
      <button class="filtro" type="button" data-periodo="26s" aria-pressed="true">26 semanas</button>
      <button class="filtro" type="button" data-periodo="base" aria-pressed="false">Base inteira</button>
      <span class="filtros__nota" id="nota-filtro" hidden>Esta aba usa a janela de 26 semanas da segmentação; o período não se aplica.</span>
      <button class="filtro filtro--contraste" id="alto-contraste" type="button" aria-pressed="false" title="Texturas nos gráficos, além da cor">Alto contraste</button>
    </div>

    <main class="conteudo">
      <section class="painel-aba" id="painel-visao-geral" role="tabpanel" aria-labelledby="aba-visao-geral"></section>
      <section class="painel-aba" id="painel-ficha" role="tabpanel" aria-labelledby="aba-ficha" hidden></section>
      <section class="painel-aba" id="painel-segmentos" role="tabpanel" aria-labelledby="aba-segmentos" hidden></section>
    </main>

    <footer class="rodape" id="sobre-os-dados" aria-label="Sobre os dados">Sobre os dados: carregando…</footer>
  </div>
</body>
</html>
